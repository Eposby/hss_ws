/**:
  ros__parameters:
    camera_id: 0
    width: 640
    height: 480
    fps: 30
    use_picamera: False
    stream_url: ""

    model_path: "yolov8n.pt"
    confidence: 0.70
    device: "auto"
    target_classes: ["f16", "helikopter", "iha", "balistik_fuze", "balon"]

    pid:
      pan:
        kp: 0.15
        ki: 0.01
        kd: 0.08
      tilt:
        kp: 0.15
        ki: 0.01
        kd: 0.08
      output_min: -100.0
      output_max: 100.0
      deadband: 1.0
      
    camera:
      width: 640
      height: 480
      fov_horizontal: 60.0
      fov_vertical: 45.0
      
    port: "/dev/ttyUSB0"
    baudrate: 115200
    auto_reconnect: True
